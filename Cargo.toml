[package]
name = "vampire_duo"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.16"
rand = "0.9"

# Compilation rapide en dev (le code du jeu est peu optimisé, les dépendances beaucoup)
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
